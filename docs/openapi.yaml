openapi: 3.0.3
info:
  title: Seba API
  version: 1.0.0
  description: |
    REST API for **Seba (সেবা)**, a service booking and management app.

    **Currency:** all prices are in **BDT** (Bangladeshi taka, ৳).

    **Accounts and access:** customers (`role: user`) use the customer endpoints. Endpoints under `/admin` need the JWT of an
    **admin** account (`403` for customers); the role is checked in the database on every request. Only the booking status route
    also accepts the static `X-Admin-Key` for scripted demos.

    **Sales definition:** sales/revenue = the price paid (after any discount) of bookings that are **confirmed or completed**,
    dated by the service date in the business time zone. Pending bookings are reported as the *pipeline*.

    **Conventions**
    - Base path: `/api/v1`. All bodies are JSON.
    - Success: `{ "success": true, "data": ..., "meta": { ... } }` (`meta` only on paginated lists).
    - Error: `{ "success": false, "error": { "code": "...", "message": "...", "details": [...] } }`.
    - Protected routes need `Authorization: Bearer <jwt>` (get one from `/auth/login`; use the **Authorize** button).
    - Booking conflicts are enforced by the database, so the API answers `409 SLOT_UNAVAILABLE` even under concurrent requests.
    - Times are ISO 8601 (UTC). Slot labels and `startLabel` are rendered in the business time zone (`timeZone` field).

    **Demo accounts**
    - Customer: `demo@example.com` / `Demo@1234`
    - Admin: `admin@example.com` / `Admin@1234` (accounts have a `role`: `user` or `admin`; public sign-up always creates `user`)
servers:
  - url: /api/v1
    description: This server (works locally and on Render)
tags:
  - name: Health
  - name: Auth
  - name: Users
  - name: Services
  - name: Appointments
  - name: Notifications
  - name: AI assistant
  - name: Payments
  - name: Discounts
  - name: 'Admin: services and custom fields'
  - name: 'Admin: payment methods'
  - name: 'Admin: bookings'
  - name: 'Admin: discount requests'
  - name: 'Admin: dashboard and reports'
  - name: Admin

paths:
  /health:
    get:
      tags: [Health]
      summary: Liveness and database check
      responses:
        '200':
          description: API and database are reachable
          content:
            application/json:
              example: { success: true, data: { status: ok, uptime: 124 } }

  /auth/register:
    post:
      tags: [Auth]
      summary: Create an account
      description: Password must be 8-72 characters with at least one letter and one number. Email is case-insensitive.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
            example: { name: Rahim Uddin, email: rahim@example.com, password: Passw0rd1 }
      responses:
        '201':
          description: Account created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '409':
          description: Email already registered
          content:
            application/json:
              example: { success: false, error: { code: EMAIL_TAKEN, message: An account with this email already exists } }
        '429': { $ref: '#/components/responses/RateLimited' }

  /auth/login:
    post:
      tags: [Auth]
      summary: Sign in
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
            example: { email: demo@example.com, password: Demo@1234 }
      responses:
        '200':
          description: Signed in
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401':
          description: Wrong email or password (same message for both, on purpose)
          content:
            application/json:
              example: { success: false, error: { code: INVALID_CREDENTIALS, message: Incorrect email or password } }
        '429': { $ref: '#/components/responses/RateLimited' }

  /users/me:
    get:
      tags: [Users]
      summary: Current user
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: The authenticated user
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    patch:
      tags: [Users]
      summary: Update profile
      description: Send `name` and/or `phone`. An empty string or `null` clears the phone number.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateProfileRequest' }
            example: { name: Rahim U., phone: '+880 1700 000000' }
      responses:
        '200':
          description: Updated user
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /users/me/password:
    patch:
      tags: [Users]
      summary: Change password
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword: { type: string }
                newPassword: { type: string, minLength: 8, maxLength: 72 }
            example: { currentPassword: Demo@1234, newPassword: NewPass123 }
      responses:
        '200':
          description: Password updated
          content:
            application/json:
              example: { success: true, data: { message: Password updated } }
        '400':
          description: Validation error or wrong current password (`INVALID_CURRENT_PASSWORD`)
          content:
            application/json:
              example: { success: false, error: { code: INVALID_CURRENT_PASSWORD, message: Current password is incorrect } }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /services:
    get:
      tags: [Services]
      summary: List services (search, filter, sort, paginate)
      parameters:
        - { name: search, in: query, description: Matches name, description or category (case-insensitive), schema: { type: string, maxLength: 100 } }
        - { name: category, in: query, schema: { type: string } }
        - { name: featured, in: query, description: Only featured (`true`) or only non-featured (`false`), schema: { type: string, enum: ['true', 'false'] } }
        - { name: minPrice, in: query, schema: { type: number, minimum: 0 } }
        - { name: maxPrice, in: query, schema: { type: number, minimum: 0 } }
        - name: sort
          in: query
          description: '`featured` (default) shows featured then most-booked; `popular` shows most-booked first.'
          schema: { type: string, enum: [featured, popular, price_asc, price_desc, name, newest], default: featured }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
      responses:
        '200':
          description: A page of services
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Service' }
                  meta: { $ref: '#/components/schemas/PageMeta' }
        '400': { $ref: '#/components/responses/ValidationError' }

  /services/categories:
    get:
      tags: [Services]
      summary: Categories with service counts (for filter chips)
      responses:
        '200':
          description: Categories
          content:
            application/json:
              example:
                success: true
                data:
                  - { name: Beauty, count: 4 }
                  - { name: Wellness, count: 3 }

  /services/{id}:
    get:
      tags: [Services]
      summary: Service details
      parameters:
        - { $ref: '#/components/parameters/IdPath' }
      responses:
        '200':
          description: The service
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: '#/components/schemas/Service' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }

  /services/{id}/availability:
    get:
      tags: [Services]
      summary: Time slots for a service on a date
      description: |
        Returns the slot grid for the date. `available: false` means the slot is taken, in the past,
        or inside the minimum lead time. Advisory only: the database decides at booking time.
        Allowed dates: today up to 60 days ahead.
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/IdPath' }
        - { name: date, in: query, required: true, description: Local date (YYYY-MM-DD), schema: { type: string, format: date, example: '2026-11-20' } }
      responses:
        '200':
          description: Slots for the day
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: '#/components/schemas/Availability' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /appointments:
    post:
      tags: [Appointments]
      summary: Book an appointment
      description: |
        `startTime` must be one of the available slots from the availability endpoint.
        New appointments start as `pending`.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateAppointmentRequest' }
            example: { serviceId: 5d85757b-32b8-4270-8c16-4221f140fa06, startTime: '2026-11-20T04:00:00.000Z', address: 'House 12, Road 5, Dhanmondi, Dhaka', paymentMethodId: 8f6f1c3e-0000-4000-8000-000000000001, notes: First visit }
      responses:
        '201':
          description: Booked
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: '#/components/schemas/Appointment' }
        '400':
          description: Validation error, or `INVALID_SLOT` (off the slot grid, outside working hours, or in the past)
          content:
            application/json:
              example: { success: false, error: { code: INVALID_SLOT, message: That time is not a valid bookable slot for this service } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: '`SLOT_UNAVAILABLE` (taken, or taken a moment ago by someone else) or `USER_OVERLAP` (you already have an overlapping booking)'
          content:
            application/json:
              example: { success: false, error: { code: SLOT_UNAVAILABLE, message: That time slot was just taken, please pick another } }
    get:
      tags: [Appointments]
      summary: My appointments
      description: '`upcoming` = still ahead and pending/confirmed. `past` = everything else (ended, cancelled, completed).'
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: scope, in: query, schema: { type: string, enum: [upcoming, past] } }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/AppointmentStatus' } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
      responses:
        '200':
          description: A page of the user's appointments
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Appointment' }
                  meta: { $ref: '#/components/schemas/PageMeta' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /appointments/{id}:
    get:
      tags: [Appointments]
      summary: Appointment details
      description: Only the owner can read it; anyone else gets `404`.
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/IdPath' }
      responses:
        '200':
          description: The appointment
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: '#/components/schemas/Appointment' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /appointments/{id}/cancel:
    patch:
      tags: [Appointments]
      summary: Cancel a pending appointment
      description: Only the owner can cancel, and only while the status is `pending`. The slot becomes bookable again.
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/IdPath' }
      responses:
        '200':
          description: Cancelled appointment
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: '#/components/schemas/Appointment' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Not pending
          content:
            application/json:
              example: { success: false, error: { code: NOT_CANCELLABLE, message: 'Only pending appointments can be cancelled (this one is confirmed)' } }

  /notifications:
    get:
      tags: [Notifications]
      summary: My notifications
      description: |
        In-app notifications, newest first. Customers get them when a booking is requested, confirmed,
        completed or cancelled. Admins get them for new bookings and customer cancellations.
        `meta.unreadCount` is the total number of unread notifications (for the bell badge).
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: unread, in: query, description: Only unread notifications, schema: { type: string, enum: ['true', 'false'] } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
      responses:
        '200':
          description: A page of notifications
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Notification' }
                  meta: { $ref: '#/components/schemas/PageMeta' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /notifications/unread-count:
    get:
      tags: [Notifications]
      summary: Number of unread notifications
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Unread count
          content:
            application/json:
              example: { success: true, data: { unreadCount: 3 } }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /notifications/read-all:
    post:
      tags: [Notifications]
      summary: Mark all notifications as read
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: How many were updated
          content:
            application/json:
              example: { success: true, data: { updated: 3 } }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /notifications/{id}/read:
    patch:
      tags: [Notifications]
      summary: Mark one notification as read
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/IdPath' }
      responses:
        '200':
          description: The updated notification
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: '#/components/schemas/Notification' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /ai/chat:
    post:
      tags: [AI assistant]
      summary: Ask the Seba assistant (English, Bangla or Banglish)
      description: |
        The assistant answers questions about the available services and recommends up to 3 of them.
        It detects the language of the latest message and replies in the same one:

        | `language` | Example message |
        |---|---|
        | `en` | I need a relaxing massage under ৳3000 |
        | `bn` | আমার একটা রিলাক্সিং ম্যাসাজ দরকার, বাজেট ৩০০০ টাকা |
        | `banglish` | amar jonno ekta relaxing massage lagbe, 3000 taka er moddhe |

        Limits: message up to 500 characters, up to 10 history messages, 10 requests per minute per user.
        The Gemini API key lives only on the server.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChatRequest' }
            examples:
              english:
                value: { message: 'I need a relaxing massage under ৳3000' }
              bangla:
                value: { message: 'আমার একটা রিলাক্সিং ম্যাসাজ দরকার, বাজেট ৩০০০ টাকা' }
              banglish:
                value: { message: 'amar jonno ekta relaxing massage lagbe, 3000 taka er moddhe' }
              followUp:
                value:
                  message: how long does it take?
                  history:
                    - { role: user, content: I want a classic facial }
                    - { role: assistant, content: The Classic Facial is great for glowing skin. }
      responses:
        '200':
          description: Assistant reply
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: '#/components/schemas/ChatResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503':
          description: '`AI_UNAVAILABLE` (model busy or timed out) or `AI_NOT_CONFIGURED` (no API key on the server)'
          content:
            application/json:
              example: { success: false, error: { code: AI_UNAVAILABLE, message: The assistant is busy right now. Please try again in a moment. } }

  /admin/appointments/{id}/status:
    patch:
      tags: [Admin]
      summary: Move an appointment through its lifecycle (operations/demo)
      description: |
        Allowed transitions: `pending → confirmed | cancelled`, `confirmed → completed | cancelled`.
        Confirmed appointments whose end time has passed are also completed automatically every minute.
      security: [{ adminKey: [] }]
      parameters:
        - { $ref: '#/components/parameters/IdPath' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [confirmed, completed, cancelled] }
            example: { status: confirmed }
      responses:
        '200':
          description: Updated appointment
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: '#/components/schemas/Appointment' }
        '403':
          description: Missing or wrong `X-Admin-Key`
          content:
            application/json:
              example: { success: false, error: { code: FORBIDDEN, message: Invalid admin key } }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Transition not allowed
          content:
            application/json:
              example: { success: false, error: { code: INVALID_TRANSITION, message: Cannot change status from pending to completed } }

  /payment-methods:
    get:
      tags: [Payments]
      summary: Payment options a customer can choose when booking
      description: Active methods only, set up by admins (cash, card, bKash, Nagad, ...). `requiresReference` means the customer must enter the transaction ID when booking, which an admin then verifies.
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Active payment methods
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/PaymentMethod' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /discount-requests:
    get:
      tags: [Discounts]
      summary: My discount requests and the assistant's answers
      description: |
        Customers ask for a discount through the AI assistant (`POST /ai/chat`). The assistant never grants one: it files a request,
        tells the customer an admin is reviewing it, and an admin approves (percent or fixed BDT amount) or declines.
        The assistant first asks **which exact service** the discount is for and files a request only once one specific service is named (never a guess).
        The decision is written back to the customer in their language in `reply`.

        An approved discount belongs to **that customer only** and is used by **one order**: it is applied automatically when they
        next book the service (or any service for a general request), then consumed. The next order pays the current price.
        If that booking is cancelled the discount is given back until it expires.
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: The customer's requests, newest first
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/DiscountRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /admin/services:
    get:
      tags: ['Admin: services and custom fields']
      summary: All services, including inactive ones
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: search, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string, enum: [active, inactive, all], default: all } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
      responses:
        '200':
          description: A page of services
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/AdminService' }
                  meta: { $ref: '#/components/schemas/PageMeta' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: ['Admin: services and custom fields']
      summary: Add a service (dynamic form)
      description: |
        The form is dynamic: besides the fixed fields, `attributes` carries values for the **custom fields** admins define
        (see `/admin/service-fields`). Unknown keys, wrong types, bad dropdown values and missing required fields are rejected
        with `400 VALIDATION_ERROR` and per-field details (`attributes.<key>`).
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ServiceInput' }
            example:
              name: Hot Stone Massage
              description: Smooth heated stones melt away deep muscle tension.
              price: 3200
              durationMinutes: 75
              category: Wellness
              imageUrl: https://images.unsplash.com/photo-1544161515-4ab6ce6db874?w=800
              isFeatured: false
              attributes: { staff_level: Senior specialist, materials_included: true }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: '#/components/schemas/AdminService' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: A service with this name already exists (`SERVICE_NAME_TAKEN`)
          content:
            application/json:
              example: { success: false, error: { code: SERVICE_NAME_TAKEN, message: A service with this name already exists } }

  /admin/services/{id}:
    get:
      tags: ['Admin: services and custom fields']
      summary: One service (with raw custom-field values)
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/IdPath' }]
      responses:
        '200':
          description: The service
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: '#/components/schemas/AdminService' }
        '404': { $ref: '#/components/responses/NotFound' }
        '403': { $ref: '#/components/responses/Forbidden' }
    patch:
      tags: ['Admin: services and custom fields']
      summary: Edit a service
      description: Only the fields you send change. If `attributes` is sent it replaces the stored custom values (validated against the current fields).
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/IdPath' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ServiceInput' }
            example: { price: 3500, isFeatured: true }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: '#/components/schemas/AdminService' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '403': { $ref: '#/components/responses/Forbidden' }
    delete:
      tags: ['Admin: services and custom fields']
      summary: Hide a service from customers
      description: 'Never a hard delete (past bookings and reports refer to it). Re-enable with PATCH and isActive true.'
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/IdPath' }]
      responses:
        '200':
          description: The deactivated service
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: '#/components/schemas/AdminService' }
        '404': { $ref: '#/components/responses/NotFound' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/service-fields:
    get:
      tags: ['Admin: services and custom fields']
      summary: Custom field definitions for the service form
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: All field definitions, including inactive ones
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/ServiceField' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: ['Admin: services and custom fields']
      summary: Add a custom field to the service form
      description: Types are `text`, `textarea`, `number`, `boolean` and `select` (needs `options`). The key is derived from the label when omitted and cannot change later.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ServiceFieldInput' }
            example: { label: Therapist gender, type: select, options: [Female, Male, No preference], required: false }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: '#/components/schemas/ServiceField' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '409':
          description: Key already used (`FIELD_KEY_TAKEN`)
          content:
            application/json:
              example: { success: false, error: { code: FIELD_KEY_TAKEN, message: A field with the key "therapist_gender" already exists } }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/service-fields/{id}:
    patch:
      tags: ['Admin: services and custom fields']
      summary: Edit a field (label, options, required, order, active)
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/IdPath' }]
      requestBody:
        required: true
        content:
          application/json:
            example: { label: Specialist level, required: true, sortOrder: 2 }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: '#/components/schemas/ServiceField' }
        '404': { $ref: '#/components/responses/NotFound' }
        '403': { $ref: '#/components/responses/Forbidden' }
    delete:
      tags: ['Admin: services and custom fields']
      summary: Deactivate a field
      description: Stored values are kept and come back if the field is re-enabled; customers stop seeing it.
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/IdPath' }]
      responses:
        '200':
          description: The deactivated field
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: '#/components/schemas/ServiceField' }
        '404': { $ref: '#/components/responses/NotFound' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/payment-methods:
    get:
      tags: ['Admin: payment methods']
      summary: All payment methods, including disabled ones
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Payment methods
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/PaymentMethod' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: ['Admin: payment methods']
      summary: Add a payment option
      description: |
        Money is not processed by this server. A wallet-style method (`requiresReference: true`, e.g. bKash or Nagad) asks the customer
        for the transaction ID, and an admin verifies it with `PATCH /admin/appointments/{id}/payment`.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            example: { code: rocket, name: Rocket, type: mobile_wallet, accountNumber: 01900-000000, instructions: 'Send to 01900-000000 (Personal), then enter the transaction ID.', requiresReference: true, sortOrder: 5 }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: '#/components/schemas/PaymentMethod' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '409':
          description: Code already used (`PAYMENT_CODE_TAKEN`)
          content:
            application/json:
              example: { success: false, error: { code: PAYMENT_CODE_TAKEN, message: A payment method with this code already exists } }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/payment-methods/{id}:
    patch:
      tags: ['Admin: payment methods']
      summary: Edit a payment option
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/IdPath' }]
      requestBody:
        required: true
        content:
          application/json:
            example: { accountNumber: 01711-123456, isActive: true }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: '#/components/schemas/PaymentMethod' }
        '404': { $ref: '#/components/responses/NotFound' }
        '403': { $ref: '#/components/responses/Forbidden' }
    delete:
      tags: ['Admin: payment methods']
      summary: Disable a payment option
      description: Existing bookings keep their payment method.
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/IdPath' }]
      responses:
        '200':
          description: The disabled method
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: '#/components/schemas/PaymentMethod' }
        '404': { $ref: '#/components/responses/NotFound' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/appointments:
    get:
      tags: ['Admin: bookings']
      summary: All bookings
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: status, in: query, schema: { $ref: '#/components/schemas/AppointmentStatus' } }
        - { name: paymentStatus, in: query, schema: { type: string, enum: [unpaid, submitted, paid, failed] } }
        - { name: search, in: query, description: 'Customer name or email, or service name', schema: { type: string } }
        - { name: from, in: query, description: Service date from (YYYY-MM-DD), schema: { type: string, format: date } }
        - { name: to, in: query, description: Service date to (YYYY-MM-DD), schema: { type: string, format: date } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        '200':
          description: A page of bookings with the customer
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/AdminAppointment' }
                  meta: { $ref: '#/components/schemas/PageMeta' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/appointments/{id}:
    get:
      tags: ['Admin: bookings']
      summary: One booking
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/IdPath' }]
      responses:
        '200':
          description: The booking
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: '#/components/schemas/AdminAppointment' }
        '404': { $ref: '#/components/responses/NotFound' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/appointments/{id}/payment:
    patch:
      tags: ['Admin: bookings']
      summary: Verify or reject a booking's payment
      description: Marking it `paid` records the time and notifies the customer; `failed` notifies them to contact us or pick another method. Not allowed on cancelled bookings.
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/IdPath' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [paid, failed, unpaid] }
            example: { status: paid }
      responses:
        '200':
          description: Updated booking
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: '#/components/schemas/AdminAppointment' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Booking is cancelled (`INVALID_STATE`)
          content:
            application/json:
              example: { success: false, error: { code: INVALID_STATE, message: The payment of a cancelled booking cannot be changed } }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/discount-requests:
    get:
      tags: ['Admin: discount requests']
      summary: Discount requests from customers
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [pending, approved, declined, used] } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
      responses:
        '200':
          description: A page of requests with the customer
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/DiscountRequest' }
                  meta: { $ref: '#/components/schemas/PageMeta' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/discount-requests/{id}/approve:
    patch:
      tags: ['Admin: discount requests']
      summary: Approve with a discount
      description: |
        `percent` must be 1-90; `fixed` is a BDT amount and cannot exceed the service price. The discount is valid for `expiresInDays`
        (default 14), only for that customer and for **one order**. The customer is notified and the assistant's answer is written in
        their language (Gemini, with a template fallback).
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/IdPath' }]
      requestBody:
        required: true
        content:
          application/json:
            example: { type: percent, value: 15, expiresInDays: 7, note: Loyal customer }
      responses:
        '200':
          description: The decided request
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: '#/components/schemas/DiscountRequest' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Already decided (`NOT_PENDING`)
          content:
            application/json:
              example: { success: false, error: { code: NOT_PENDING, message: This request has already been decided } }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/discount-requests/{id}/decline:
    patch:
      tags: ['Admin: discount requests']
      summary: Decline
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/IdPath' }]
      requestBody:
        content:
          application/json:
            example: { note: Prices are already discounted }
      responses:
        '200':
          description: The decided request
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: '#/components/schemas/DiscountRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Already decided (`NOT_PENDING`)
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/dashboard:
    get:
      tags: ['Admin: dashboard and reports']
      summary: Dashboard numbers
      description: Totals, sales (today, this month, all time, plus the pending pipeline), bookings by status, top services, the last 14 days and the latest bookings.
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Dashboard data
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: '#/components/schemas/Dashboard' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/reports/sales:
    get:
      tags: ['Admin: dashboard and reports']
      summary: Sales report
      description: Revenue, bookings and discounts for a date range (default last 30 days, at most 366), grouped by day, service, category or payment method.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
        - { name: groupBy, in: query, schema: { type: string, enum: [day, service, category, payment], default: day } }
      responses:
        '200':
          description: The report
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: '#/components/schemas/SalesReport' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/reports/sales.csv:
    get:
      tags: ['Admin: dashboard and reports']
      summary: Sales report as CSV
      description: Same parameters as the JSON report; downloads `seba-sales-<from>_<to>.csv`.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
        - { name: groupBy, in: query, schema: { type: string, enum: [day, service, category, payment], default: day } }
      responses:
        '200':
          description: CSV file
          content:
            text/csv:
              example: |
                Service,Bookings,Revenue (BDT),Discounts (BDT)
                Swedish Massage,1,2500,0
                Total,1,2500,0
        '403': { $ref: '#/components/responses/Forbidden' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token from `/auth/login` or `/auth/register` (valid 7 days).
    adminKey:
      type: apiKey
      in: header
      name: X-Admin-Key
  parameters:
    IdPath:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
  responses:
    Forbidden:
      description: Signed in but not an admin
      content:
        application/json:
          example: { success: false, error: { code: FORBIDDEN, message: Admin access required } }
    ValidationError:
      description: Request failed validation
      content:
        application/json:
          example:
            success: false
            error:
              code: VALIDATION_ERROR
              message: Validation failed
              details:
                - { field: email, message: Enter a valid email address }
    Unauthorized:
      description: Missing, invalid or expired token
      content:
        application/json:
          example: { success: false, error: { code: UNAUTHORIZED, message: Authentication required } }
    NotFound:
      description: Resource not found (or not owned by the caller)
      content:
        application/json:
          example: { success: false, error: { code: NOT_FOUND, message: Appointment not found } }
    RateLimited:
      description: Too many requests
      content:
        application/json:
          example: { success: false, error: { code: RATE_LIMITED, message: Too many attempts, please try again later } }
  schemas:
    User:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string, example: Demo User }
        email: { type: string, format: email, example: demo@example.com }
        phone: { type: string, nullable: true, example: null }
        role: { type: string, enum: [user, admin], example: user }
        address: { type: string, nullable: true, description: Default service address used to prefill bookings }
        createdAt: { type: string, format: date-time }
    RegisterRequest:
      type: object
      required: [name, email, password]
      properties:
        name: { type: string, minLength: 2, maxLength: 100 }
        email: { type: string, format: email }
        password: { type: string, minLength: 8, maxLength: 72 }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string }
    UpdateProfileRequest:
      type: object
      properties:
        name: { type: string, minLength: 2, maxLength: 100 }
        phone: { type: string, nullable: true, description: 'Digits, spaces, +, (), -; empty string or null clears it' }
        address: { type: string, nullable: true, minLength: 5, maxLength: 300, description: 'Default service address; empty string or null clears it' }
    AuthResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        data:
          type: object
          properties:
            user: { $ref: '#/components/schemas/User' }
            token: { type: string, description: JWT }
    Service:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string, example: Swedish Massage }
        description: { type: string }
        price: { type: number, description: Price in BDT (Bangladeshi taka), example: 2500 }
        durationMinutes: { type: integer, example: 60 }
        imageUrl: { type: string, nullable: true }
        category: { type: string, example: Wellness }
        isFeatured: { type: boolean }
        bookingsCount: { type: integer, description: Times this service has been booked }
        attributes:
          type: array
          description: Values of the admin-defined custom fields (service details only)
          items: { $ref: '#/components/schemas/ServiceAttribute' }
    Notification:
      type: object
      properties:
        id: { type: string, format: uuid }
        type: { type: string, example: booking_confirmed, description: 'booking_created, booking_confirmed, booking_completed, booking_cancelled, booking_new (admins)' }
        title: { type: string, example: Booking confirmed }
        body: { type: string, example: 'Good news! Your Swedish Massage on Tue, Nov 17, 2026, 10:00 AM is confirmed.' }
        data: { type: object, nullable: true, properties: { appointmentId: { type: string, format: uuid } } }
        isRead: { type: boolean }
        createdAt: { type: string, format: date-time }
    PageMeta:
      type: object
      properties:
        page: { type: integer, example: 1 }
        limit: { type: integer, example: 20 }
        total: { type: integer, example: 14 }
        totalPages: { type: integer, example: 1 }
        unreadCount: { type: integer, description: 'Only on /notifications', example: 2 }
    Slot:
      type: object
      properties:
        start: { type: string, format: date-time }
        end: { type: string, format: date-time }
        label: { type: string, example: 10:00 AM }
        available: { type: boolean }
    Availability:
      type: object
      properties:
        date: { type: string, format: date }
        timeZone: { type: string, example: UTC }
        serviceId: { type: string, format: uuid }
        durationMinutes: { type: integer }
        slots:
          type: array
          items: { $ref: '#/components/schemas/Slot' }
    AppointmentStatus:
      type: string
      enum: [pending, confirmed, cancelled, completed]
    CreateAppointmentRequest:
      type: object
      required: [serviceId, startTime, address, paymentMethodId]
      properties:
        serviceId: { type: string, format: uuid }
        paymentMethodId: { type: string, format: uuid, description: One of the active methods from GET /payment-methods }
        paymentReference: { type: string, minLength: 4, maxLength: 60, description: 'Transaction ID, required when the method requiresReference (e.g. bKash TrxID)' }
        startTime: { type: string, format: date-time }
        address: { type: string, minLength: 5, maxLength: 300, description: Where the service takes place }
        notes: { type: string, maxLength: 500 }
    Appointment:
      type: object
      properties:
        id: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/AppointmentStatus' }
        startTime: { type: string, format: date-time }
        endTime: { type: string, format: date-time }
        startLabel: { type: string, example: 'Fri, Nov 20, 2026, 10:00 AM' }
        timeZone: { type: string, example: Asia/Dhaka }
        address: { type: string, nullable: true, description: Where the service takes place (null only for bookings made before addresses existed) }
        notes: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        price: { type: number, description: Amount to pay in BDT (after any discount), example: 2000 }
        originalPrice: { type: number, example: 2500 }
        discountAmount: { type: number, example: 500 }
        paymentStatus: { type: string, enum: [unpaid, submitted, paid, failed] }
        paymentReference: { type: string, nullable: true }
        paidAt: { type: string, format: date-time, nullable: true }
        paymentMethod:
          type: object
          nullable: true
          properties:
            id: { type: string, format: uuid }
            code: { type: string, example: bkash }
            name: { type: string, example: bKash }
            type: { type: string, enum: [cash, card, mobile_wallet, bank] }
        service:
          type: object
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
            price: { type: number }
            durationMinutes: { type: integer }
            imageUrl: { type: string, nullable: true }
            category: { type: string }
    ChatRequest:
      type: object
      required: [message]
      properties:
        message: { type: string, minLength: 1, maxLength: 500 }
        history:
          type: array
          maxItems: 10
          items:
            type: object
            required: [role, content]
            properties:
              role: { type: string, enum: [user, assistant] }
              content: { type: string, maxLength: 1000 }
    ChatResponse:
      type: object
      properties:
        reply: { type: string }
        language: { type: string, enum: [en, bn, banglish] }
        discountRequest:
          type: object
          nullable: true
          description: Set when the customer asked for a discount for one specific service. The assistant never grants it; an admin decides and the answer arrives later (see GET /discount-requests and notifications). When the service is unclear the assistant asks which one instead and this stays null.
          properties:
            id: { type: string, format: uuid }
            status: { type: string, example: pending }
            created: { type: boolean, description: false when an open request for the same service already existed }
        recommendedServices:
          type: array
          maxItems: 3
          items:
            type: object
            properties:
              id: { type: string, format: uuid }
              name: { type: string }
              category: { type: string }
              price: { type: number }
              durationMinutes: { type: integer }
              imageUrl: { type: string, nullable: true }
    ServiceAttribute:
      type: object
      properties:
        key: { type: string, example: staff_level }
        label: { type: string, example: Specialist level }
        type: { type: string, enum: [text, textarea, number, boolean, select] }
        value: { example: Senior specialist }
    ServiceField:
      type: object
      properties:
        id: { type: string, format: uuid }
        key: { type: string, example: staff_level }
        label: { type: string, example: Specialist level }
        type: { type: string, enum: [text, textarea, number, boolean, select] }
        options: { type: array, items: { type: string }, example: [Standard, Senior specialist] }
        required: { type: boolean }
        sortOrder: { type: integer }
        isActive: { type: boolean }
    ServiceFieldInput:
      type: object
      required: [label, type]
      properties:
        label: { type: string, minLength: 2, maxLength: 80 }
        key: { type: string, pattern: '^[a-z][a-z0-9_]{1,39}$', description: Optional; derived from the label }
        type: { type: string, enum: [text, textarea, number, boolean, select] }
        options: { type: array, items: { type: string }, description: Required for select }
        required: { type: boolean, default: false }
        sortOrder: { type: integer, default: 0 }
    ServiceInput:
      type: object
      required: [name, description, price, durationMinutes, category]
      properties:
        name: { type: string, minLength: 2, maxLength: 120 }
        description: { type: string, minLength: 10, maxLength: 2000 }
        price: { type: number, minimum: 0, description: BDT }
        durationMinutes: { type: integer, minimum: 5, maximum: 480 }
        category: { type: string }
        imageUrl: { type: string, nullable: true, description: http(s) URL }
        isFeatured: { type: boolean, default: false }
        isActive: { type: boolean, default: true }
        attributes: { type: object, additionalProperties: true, description: Values keyed by custom field key }
    AdminService:
      allOf:
        - $ref: '#/components/schemas/Service'
        - type: object
          properties:
            isActive: { type: boolean }
            attributeValues: { type: object, additionalProperties: true, description: Raw custom-field values keyed by field key }
            createdAt: { type: string, format: date-time }
    PaymentMethod:
      type: object
      properties:
        id: { type: string, format: uuid }
        code: { type: string, example: bkash }
        name: { type: string, example: bKash }
        type: { type: string, enum: [cash, card, mobile_wallet, bank] }
        instructions: { type: string, nullable: true }
        accountNumber: { type: string, nullable: true }
        requiresReference: { type: boolean }
        isActive: { type: boolean, description: Admin responses only }
        sortOrder: { type: integer, description: Admin responses only }
    AdminAppointment:
      allOf:
        - $ref: '#/components/schemas/Appointment'
        - type: object
          properties:
            customer:
              type: object
              properties:
                id: { type: string, format: uuid }
                name: { type: string }
                email: { type: string }
                phone: { type: string, nullable: true }
    DiscountRequest:
      type: object
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [pending, approved, declined, used, expired], description: expired is derived when an approved discount passed its expiry }
        message: { type: string, description: What the customer asked }
        language: { type: string, enum: [en, bn, banglish] }
        service:
          type: object
          nullable: true
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
            price: { type: number }
        discountType: { type: string, enum: [percent, fixed], nullable: true }
        discountValue: { type: number, nullable: true, description: Percent or BDT amount }
        reply: { type: string, nullable: true, description: 'The assistant''s answer to the customer, in their language' }
        decidedAt: { type: string, format: date-time, nullable: true }
        expiresAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
        adminNote: { type: string, nullable: true, description: Admin responses only }
        customer: { type: object, description: Admin responses only }
    SalesPeriod:
      type: object
      properties:
        bookings: { type: integer }
        revenue: { type: number }
    Dashboard:
      type: object
      properties:
        timeZone: { type: string }
        totals:
          type: object
          properties:
            services: { type: integer }
            customers: { type: integer }
            bookings: { type: integer }
            pendingBookings: { type: integer }
            pendingDiscountRequests: { type: integer }
            pendingPayments: { type: integer }
        sales:
          type: object
          properties:
            today: { $ref: '#/components/schemas/SalesPeriod' }
            thisMonth: { $ref: '#/components/schemas/SalesPeriod' }
            allTime: { $ref: '#/components/schemas/SalesPeriod' }
            pipeline: { type: object, properties: { bookings: { type: integer }, value: { type: number } } }
        byStatus: { type: object, additionalProperties: { type: integer } }
        topServices:
          type: array
          items:
            type: object
            properties:
              serviceId: { type: string, format: uuid }
              name: { type: string }
              bookings: { type: integer }
              revenue: { type: number }
        daily:
          type: array
          items:
            type: object
            properties:
              date: { type: string, format: date }
              bookings: { type: integer }
              revenue: { type: number }
        recentBookings:
          type: array
          items: { $ref: '#/components/schemas/AdminAppointment' }
    SalesReport:
      type: object
      properties:
        from: { type: string, format: date }
        to: { type: string, format: date }
        groupBy: { type: string }
        groupLabel: { type: string }
        timeZone: { type: string }
        summary:
          type: object
          properties:
            revenue: { type: number }
            bookings: { type: integer }
            averageOrderValue: { type: number }
            discountsGiven: { type: number }
            paidAmount: { type: number }
            unpaidAmount: { type: number }
            cancelledBookings: { type: integer }
            pendingBookings: { type: integer }
        rows:
          type: array
          items:
            type: object
            properties:
              key: { type: string }
              bookings: { type: integer }
              revenue: { type: number }
              discounts: { type: number }
